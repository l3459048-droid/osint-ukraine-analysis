[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-local"
version = "0.3.0"
description = "Local-first OSINT document ingestion, search and Web UI"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "watchdog>=4,<7",
]

[project.optional-dependencies]
ocr = ["Pillow>=10,<13", "pytesseract>=0.3.13,<1"]
search = ["sentence-transformers>=6,<7"]
all = [
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "sentence-transformers>=6,<7",
]
dev = ["pytest>=8,<10"]

[project.scripts]
osint-local = "osint_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
