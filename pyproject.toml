[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-local"
version = "0.9.17"
description = "Local-first OSINT document analysis with filtered RAG, fast offline translation and local Ollama chat"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "watchdog>=4,<7",
]

[project.optional-dependencies]
ocr = ["Pillow>=10,<13", "pytesseract>=0.3.13,<1"]
search = ["sentence-transformers>=6,<7"]
translate = ["argostranslate>=1.9,<2"]
fasttranslate = [
  "ctranslate2>=4.7,<5",
  "sentencepiece>=0.2,<1",
  "transformers>=5,<6",
  "huggingface-hub>=1,<2",
  "torch>=2.2,<3",
]
all = [
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "sentence-transformers>=6,<7",
  "argostranslate>=1.9,<2",
  "ctranslate2>=4.7,<5",
  "sentencepiece>=0.2,<1",
  "transformers>=5,<6",
  "huggingface-hub>=1,<2",
  "torch>=2.2,<3",
]
dev = ["pytest>=8,<10"]

[project.scripts]
osint-local = "osint_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
