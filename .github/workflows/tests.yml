name: test-local-osint

on:
  push:
    branches:
      - local-ingestion-v1
  pull_request:
    branches:
      - main
      - local-ingestion-v1

concurrency:
  group: test-local-osint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q


  fast-translation-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full application
        run: python -m pip install -e ".[all]"
      - name: Validate dependency graph
        run: python -m pip check
      - name: Import Fast Translation stack
        run: python -c "import ctranslate2, sentencepiece, transformers, sentence_transformers, argostranslate; print(ctranslate2.__version__, transformers.__version__, sentence_transformers.__version__)"
