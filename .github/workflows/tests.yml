name: test-local-osint

on:
  push:
    branches:
      - local-ingestion-v1
  pull_request:
    branches:
      - main
      - local-ingestion-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
